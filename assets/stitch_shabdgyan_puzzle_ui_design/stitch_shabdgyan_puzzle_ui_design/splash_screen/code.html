<body class="bg-primary-container text-on-surface flex flex-col items-center justify-center min-h-screen relative overflow-hidden selection:bg-secondary selection:text-primary-container">
<!-- Ambient background effect -->
<div class="absolute inset-0 z-0 opacity-10 bg-[radial-gradient(circle_at_center,rgba(173,239,209,0.2)_0%,transparent_70%)]"></div>
<main class="relative z-10 flex flex-col items-center justify-center w-full max-w-md px-gutter text-center">
<!-- Logo Icon with Glow -->
<div class="relative flex items-center justify-center mb-md">
<div class="absolute inset-0 rounded-full glow-ring bg-secondary/10 animate-pulse"></div>
<div class="relative z-10 p-sm rounded-2xl bg-secondary/10 border border-secondary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[64px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                    extension
                </span>
</div>
</div>
<!-- Brand Name -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-secondary tracking-[4px] mb-xs">

        </h1>
<!-- Tagline -->
<p class="font-title-lg text-title-lg text-secondary/70 opacity-80 mt-2">
            Clue Padho · Word Banao
        </p>
</main>
<!-- Version Number -->
<footer class="absolute bottom-lg text-center w-full z-10">
<p class="font-label-bold text-label-bold text-on-surface-variant/50 uppercase tracking-widest">
            v1.0.0
        </p>
</footer>
<!-- Simple loading animation script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoIcon = document.querySelector('.material-symbols-outlined');
            let rotation = 0;
            
            // Subtle rotation effect on load to show activity
            const animateGlow = () => {
                rotation += 0.5;
                if (logoIcon) {
                    logoIcon.style.transform = `rotate(${Math.sin(rotation * 0.05) * 5}deg)`;
                }
                requestAnimationFrame(animateGlow);
            };
            
            animateGlow();
        });
    </script>
