<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SHABDGYAN - Game Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#43474e",
                    "error-container": "#93000a",
                    "on-tertiary-container": "#6b89af",
                    "secondary-fixed-dim": "#93d4b7",
                    "on-surface-variant": "#c4c6cf",
                    "surface-container-lowest": "#0c0f0f",
                    "on-primary-container": "#6f89ad",
                    "on-secondary-container": "#82c2a6",
                    "error": "#ffb4ab",
                    "inverse-on-surface": "#2f3131",
                    "on-secondary": "#003827",
                    "surface-container-low": "#1a1c1c",
                    "on-tertiary": "#0f3254",
                    "outline": "#8d9198",
                    "inverse-primary": "#466082",
                    "surface-variant": "#333535",
                    "on-surface": "#e2e2e2",
                    "tertiary-container": "#00203d",
                    "tertiary-fixed-dim": "#aac9f2",
                    "surface-container": "#1e2020",
                    "secondary-container": "#07513b",
                    "on-primary": "#163151",
                    "on-tertiary-fixed-variant": "#2a486b",
                    "on-background": "#e2e2e2",
                    "tertiary-fixed": "#d2e4ff",
                    "secondary": "#93d4b7",
                    "background": "#121414",
                    "primary-fixed-dim": "#aec8ef",
                    "primary-container": "#00203f",
                    "surface-tint": "#aec8ef",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed": "#aef0d2",
                    "on-error": "#690005",
                    "primary-fixed": "#d3e3ff",
                    "on-tertiary-fixed": "#001c37",
                    "surface": "#121414",
                    "on-secondary-fixed-variant": "#07513b",
                    "on-primary-fixed-variant": "#2e4869",
                    "on-secondary-fixed": "#002116",
                    "surface-dim": "#121414",
                    "surface-container-highest": "#333535",
                    "surface-bright": "#37393a",
                    "inverse-surface": "#e2e2e2",
                    "tertiary": "#aac9f2",
                    "on-primary-fixed": "#001c38",
                    "primary": "#aec8ef",
                    "surface-container-high": "#282a2b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-max": "1200px",
                    "lg": "40px",
                    "sm": "12px",
                    "gutter": "16px",
                    "xl": "64px",
                    "md": "24px",
                    "xs": "4px",
                    "base": "8px"
            },
            "fontFamily": {
                    "display-lg-mobile": ["Nunito Sans"],
                    "label-bold": ["Nunito Sans"],
                    "display-lg": ["Nunito Sans"],
                    "tile-text": ["Nunito Sans"],
                    "body-md": ["Nunito Sans"],
                    "title-lg": ["Nunito Sans"],
                    "headline-md": ["Nunito Sans"]
            },
            "fontSize": {
                    "display-lg-mobile": ["36px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "900" }],
                    "label-bold": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                    "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "900" }],
                    "tile-text": ["28px", { "lineHeight": "1", "fontWeight": "800" }],
                    "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                    "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                    "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "800" }]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: #00203F; /* Deep Navy Background */
            color: #e2e2e2;
        }
        /* Custom Mint Border Utility */
        .border-mint {
            border-color: rgba(173, 239, 209, 0.15);
        }
        .border-mint-solid {
            border-color: #ADEFD1;
        }
        .text-mint {
            color: #ADEFD1;
        }
        .bg-mint {
            background-color: #ADEFD1;
        }
        .bg-navy {
            background-color: #00203F;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-start overflow-hidden">
<!-- Progress Bar (Thin Mint) -->
<div class="w-full h-1 bg-surface-container-highest">
<div class="h-full bg-mint" style="width: 40%;"></div>
</div>
<!-- Top Action Bar (Custom, not standard TopAppBar as it's a specific game state) -->
<header class="w-full max-w-[600px] flex items-center justify-between px-gutter py-sm text-on-surface">
<button class="p-2 hover:bg-surface-variant rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-bold text-label-bold text-on-surface-variant tracking-wider uppercase">Puzzle 6/15</span>
</div>
<div class="flex items-center gap-1 bg-surface-variant/50 px-3 py-1 rounded-full">
<span class="material-symbols-outlined text-mint text-[18px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-label-bold text-label-bold text-on-surface">1,250</span>
</div>
</header>
<!-- Main Game Area -->
<main class="w-full max-w-[600px] flex-1 flex flex-col px-gutter py-md gap-lg relative">
<!-- Clue Card -->
<div class="w-full bg-navy border border-mint-solid rounded-xl p-md flex flex-col items-center justify-center min-h-[140px] relative overflow-hidden">
<!-- Subtle gradient overlay for depth -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-variant/10 pointer-events-none"></div>
<span class="font-label-bold text-label-bold text-mint mb-2 tracking-[0.1em] uppercase opacity-80">CLUE / PAHELI</span>
<h2 class="font-headline-md text-headline-md text-center text-on-surface max-w-[80%] leading-snug">
                A large body of water, but smaller than an ocean.
            </h2>
</div>
<!-- Answer Boxes -->
<div class="w-full flex justify-center gap-xs mt-4">
<!-- Filled Box -->
<div class="w-12 h-12 md:w-14 md:h-14 rounded-lg bg-mint text-navy font-tile-text text-tile-text flex items-center justify-center border-2 border-mint-solid shadow-[0_0_15px_rgba(173,239,209,0.3)] transition-all transform hover:scale-105 cursor-pointer">
                S
            </div>
<!-- Empty Box (Dashed) -->
<div class="w-12 h-12 md:w-14 md:h-14 rounded-lg bg-navy border-2 border-dashed border-mint-solid flex items-center justify-center opacity-70">
<span class="w-4 h-1 bg-mint-solid rounded-full opacity-30"></span>
</div>
<!-- Empty Box (Dashed) -->
<div class="w-12 h-12 md:w-14 md:h-14 rounded-lg bg-navy border-2 border-dashed border-mint-solid flex items-center justify-center opacity-70">
<span class="w-4 h-1 bg-mint-solid rounded-full opacity-30"></span>
</div>
</div>
<!-- Letter Grid -->
<div class="w-full max-w-[400px] mx-auto mt-auto mb-8 grid grid-cols-4 gap-xs md:gap-sm">
<!-- Grid Tiles -->
<script>
                const letters = ['A', 'E', 'S', 'T', 'O', 'M', 'P', 'R', 'K', 'L', 'I', 'C', 'U', 'N', 'D', 'Y'];
                letters.forEach(letter => {
                    let tileHTML = `
                        <button class="aspect-square rounded-lg bg-navy border border-mint flex items-center justify-center font-tile-text text-tile-text text-on-surface hover:bg-mint hover:text-navy hover:border-mint-solid transition-colors duration-200 active:scale-95">
                            ${letter}
                        </button>
                    `;
                    document.write(tileHTML);
                });
            </script>
</div>
</main>
<!-- Bottom Action Row -->
<div class="w-full max-w-[600px] px-gutter pb-xl pt-4 flex items-center justify-between gap-4 mt-auto border-t border-mint bg-navy z-10 relative">
<button class="flex-1 py-3 rounded-full border border-mint text-on-surface font-label-bold text-label-bold hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">backspace</span>
            Clear
        </button>
<button class="flex-1 py-3 rounded-full border border-mint-solid text-mint font-label-bold text-label-bold hover:bg-mint/10 transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lightbulb</span>
            Hint
        </button>
<button class="flex-1 py-3 rounded-full bg-mint text-navy font-label-bold text-label-bold hover:bg-mint/90 transition-colors flex items-center justify-center shadow-[0_0_20px_rgba(173,239,209,0.2)] active:scale-95 duration-100">
            Check
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">check</span>
</button>
</div>
<!-- Decorative background elements (subtle) -->
<div class="fixed top-1/4 left-0 w-64 h-64 bg-mint/5 rounded-full blur-[100px] pointer-events-none z-[-1]"></div>
<div class="fixed bottom-1/4 right-0 w-80 h-80 bg-mint/5 rounded-full blur-[120px] pointer-events-none z-[-1]"></div>
</body></html>
